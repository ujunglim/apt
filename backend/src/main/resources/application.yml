spring:
  application:
    name: apt-api
  config:
    # 프로젝트 루트의 .env(POSTGRES_* 등)를 설정값으로 읽는다. 비밀값을 이 파일에 적지 않기 위해서다.
    # backend/ 에서 실행하면 ../.env, 루트에서 실행하면 ./.env 를 찾는다. 없으면 환경변수만 사용한다.
    import:
      - optional:file:../.env[.properties]
      - optional:file:./.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      read-only: true          # 이 API는 api 스키마 뷰를 읽기만 한다
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none           # 스키마는 db/sql 이 관리한다. JPA가 만들거나 바꾸지 않는다
    properties:
      hibernate:
        default_schema: api

server:
  port: 8081                   # 8080 은 Airflow UI 가 쓰고 있다

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
